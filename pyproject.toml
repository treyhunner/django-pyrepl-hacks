[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[project]
name = "django-pyrepl-hacks"
version = "0.1.1"
description = "A Django shell that uses the new Python REPL, with pyrepl-hacks key bindings."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Trey Hunner", email = "trey@treyhunner.com"},
]
keywords = ["django", "repl", "shell", "pyrepl", "keyboard", "shortcuts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.2",
    "pyrepl-hacks>=0.5.0",
]

[project.urls]
Documentation = "https://github.com/treyhunner/django-pyrepl-hacks#readme"
Changelog = "https://github.com/treyhunner/django-pyrepl-hacks/blob/main/CHANGELOG.md"
Issues = "https://github.com/treyhunner/django-pyrepl-hacks/issues"
Source = "https://github.com/treyhunner/django-pyrepl-hacks"

[dependency-groups]
test = ["coverage[toml]"]
lint = ["ruff", "rumdl"]
typecheck = ["mypy", "django-stubs"]
dev = ["prek"]

[tool.uv]
required-version = ">=0.9.6"

[tool.uv.build-backend]
module-name = "django_pyrepl_hacks"
source-include = ["tests/**", "CHANGELOG.md"]

[tool.coverage.run]
source = ["django_pyrepl_hacks", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "COM", # flake8-commas
    "DJ",  # flake8-django
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

# mypy cannot find _pyrepl or _colorize, since they are private stdlib modules
[[tool.mypy.overrides]]
module = ["_pyrepl.*", "_colorize", "pyrepl_hacks.*"]
ignore_missing_imports = true
